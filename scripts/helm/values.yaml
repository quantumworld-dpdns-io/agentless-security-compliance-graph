replicaCount: 2

image:
  repository: ghcr.io/quantumworld-dpdns-io/agentless-security-compliance-graph
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

env:
  CG_ENVIRONMENT: production
  CG_DATABASE_URL: duckdb:///data/compliance.db
