[package]
name = "compliance-graph-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "compliance_graph_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
duckdb = { version = "0.10", features = ["vtab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
