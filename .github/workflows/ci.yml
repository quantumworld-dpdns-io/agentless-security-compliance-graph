name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "stable"
  GO_VERSION: "1.22"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python deps
        run: |
          pip install ruff mypy pre-commit
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: mypy
        run: mypy src/ --ignore-missing-imports
      - name: Rust clippy
        run: cd native && cargo clippy -- -D warnings
      - name: Go vet
        run: cd agentless && go vet ./...
      - name: Pre-commit checks
        run: pre-commit run --all-files || true

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          pip install -e ".[quantum,test]"
      - name: Unit tests
        run: |
          pytest tests/unit -v --cov=src --cov-report=xml --cov-report=term
      - name: Integration tests
        run: |
          pytest tests/integration -v || true
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -e ".[quantum,test]"
      - name: Run benchmarks
        run: pytest tests/benchmark/ -v --benchmark-only --benchmark-json benchmark.json
      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install bandit semgrep
      - name: Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true
      - name: Semgrep
        run: semgrep --config=auto src/ --json -o semgrep-report.json || true
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

  robot-tests:
    name: Robot Framework Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -e ".[test]"
      - name: Start API
        run: |
          uvicorn compliance_graph.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
      - name: Run Robot tests
        run: |
          robot --outputdir robot-results tests/robot/ || true
      - name: Upload Robot results
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: robot-results/

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Build Rust extension
        run: |
          cd native && cargo build --release
      - name: Build Go binary
        run: |
          cd agentless && go build -o ../bin/agentless-discovery ./...
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            bin/*
