[project]
name = "compliance-graph"
version = "0.1.0"
description = "Agentless internal security compliance graph – maps devices, AD accounts, CVEs, and policy gaps"
requires-python = ">=3.11"
authors = [{ name = "quantumworld-dpdns-io" }]
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.1.0",
    "qiskit-optimization>=0.6.0",
    "qiskit-ibm-runtime>=0.24.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "robotframework>=7.0.0",
    "robotframework-requests>=0.9.0",
    "robotframework-jsonlibrary>=0.5.0",
    "hypothesis>=6.100.0",
    "syrupy>=4.6.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "nox>=2024.0.0",
    "pdm>=2.15.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
